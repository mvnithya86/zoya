<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ಕನ್ನಡ ಒತ್ತಕ್ಷರ ಚಾಲೆಂಜ್ - ಪುಟ 18</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #cfe8f7; text-align: center; padding: 20px; }
    .box { background: white; padding: 20px; border-radius: 15px; max-width: 450px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .clue-text { font-size: 18px; color: #555; margin-bottom: 5px; }
    .target-word { font-size: 32px; font-weight: bold; color: #8e44ad; background: #f3e5f5; padding: 12px; border-radius: 8px; margin-bottom: 20px; }
    button { display: block; width: 100%; margin: 8px 0; padding: 12px; border-radius: 10px; border: none; background: #fff4b3; font-size: 18px; font-weight: bold; cursor: pointer; }
    #score { font-size: 20px; font-weight: bold; margin-bottom: 15px; }
    #result { font-size: 24px; font-weight: bold; color: #27ae60; margin-top: 20px; }
  </style>
</head>
<body>

<h2>📅 ಒತ್ತಕ್ಷರ ಕಲಿಕಾ ಪಾಠ ೨ ('ಸ' ಮತ್ತು 'ಳ' ಒತ್ತು) - ಪುಟ 18</h2>
<div id="score">Score: 0</div>
<div class="box" id="quiz"></div>
<div id="result"></div>

<script>
let questions = [
  // 'ಸ' ಒತ್ತು ಪದಗಳು
  {q: "ರಸ್ತೆಯಲ್ಲಿ ಚಲಿಸುವ ಸಾರಿಗೆ ವಾಹನ? (Bus)", options: ["ಬಸ್ಸು", "ಒಸ್ಸೆ", "ವಯಸ್ಸು"], answer: 0},
  {q: "ಚಿತ್ರದಲ್ಲಿ ಸಭೆ ನಡೆಸುತ್ತಿರುವ ಸನ್ನಿವೇಶ? (Meeting/Assembly)", options: ["ಒಸ್ಸೆ / ಹೊಸಗೆ", "ಬಸ್ಸು", "ಮನಸ್ಸು"], answer: 0},
  {q: "ಚಿತ್ರದಲ್ಲಿ ವೃದ್ಧಾಪ್ಯವನ್ನು ಸೂಚಿಸುವ ಪದ? (Age)", options: ["ವಯಸ್ಸು", "ಶಿರಸ್ಸು", "ಯಶಸ್ಸು"], answer: 0},
  {q: "ಮೆದುಳು ಮತ್ತು ಯೋಚನೆಗೆ ಸಂಬಂಧಿಸಿದ ಚಿತ್ರ? (Mind)", options: ["ಮನಸ್ಸು", "ಶಿರಸ್ಸು", "ಬಸ್ಸು"], answer: 0},
  {q: "ತಲೆ ಅಥವಾ ಮುಖದ ಭಾಗಕ್ಕೆ ಏನೆನ್ನುತ್ತಾರೆ? (Head)", options: ["ಶಿರಸ್ಸು", "ಯಶಸ್ಸು", "ಮನಸ್ಸು"], answer: 0},
  {q: "ಕಪ್ ಗೆದ್ದು ಸಾಧನೆ ಮಾಡಿರುವುದಕ್ಕೆ ಏನೆನ್ನುತ್ತಾರೆ? (Success)", options: ["ಯಶಸ್ಸು", "ವಯಸ್ಸು", "ಬಸ್ಸು"], answer: 0},

  // 'ಳ' ಒತ್ತು ಪದಗಳು
  {q: "ಹಸಿರಾಗಿರುವ ಹಳ್ಳಿಯ ಚಿತ್ರ? (Village)", options: ["ಹಳ್ಳಿ", "ಬಳ್ಳಿ", "ಹೊರಳು"], answer: 0},
  {q: "ಗಿಡದ ಆಸರೆ ಪಡೆದು ಹರಡುವ ಬಳ್ಳಿ? (Creeper/Vine)", options: ["ಬಳ್ಳಿ", "ಹಳ್ಳಿ", "ಪೊಳ್ಳು"], answer: 0},
  {q: "ಚಿತ್ರದಲ್ಲಿರುವ ಒಣ ಮರದ ದಿಮ್ಮಿಗಳು? (Hollow log/Wood)", options: ["ಪೊಳ್ಳು", "ಎಳ್ಳು", "ಕಳ್ಳ"], answer: 0},
  {q: "ಸಂಕ್ರಾಂತಿಗೆ ಬಳಸುವ ಸಣ್ಣ ಧಾನ್ಯ? (Sesame seeds)", options: ["ಎಳ್ಳು", "ಪೊಳ್ಳು", "ಬೆಳ್ಳುಳ್ಳಿ"], answer: 0},
  {q: "ಚಿತ್ರದಲ್ಲಿ ಕಳ್ಳತನ ಮಾಡುತ್ತಿರುವ ವ್ಯಕ್ತಿ ಯಾರು? (Thief)", options: ["ಕಳ್ಳ", "ಸೊಳ್ಳೆ", "ಹಳ್ಳಿ"], answer: 0},
  {q: "ಕಚ್ಚುವ ಸಣ್ಣ ಕೀಟ ಯಾವುದು? (Mosquito)", options: ["ಸೊಳ್ಳೆ", "ಕಳ್ಳ", "ಬಳ್ಳಾರಿ"], answer: 0},
  {q: "ಚಿತ್ರದಲ್ಲಿರುವ ಬಳ್ಳಾರಿ ರೈಲ್ವೆ ಜಂಕ್ಷನ್? (Ballari)", options: ["ಬಳ್ಳಾರಿ", "ತಾಳಪತ್ರ", "ಬೆಳ್ಳುಳ್ಳಿ"], answer: 0},
  {q: "ಚಿತ್ರದಲ್ಲಿರುವ ತಾಳಪತ್ರ ಅಥವಾ ಹಳೆಯ ಓಲೆಗರಿ? (Palm leaf manuscript)", options: ["ತಾಳಪತ್ರ", "ಬಳ್ಳಾರಿ", "ಈರುಳ್ಳಿ"], answer: 0},
  {q: "ಅಡುಗೆಗೆ ಬಳಸುವ ಬಿಳಿ ಸಾಂಬಾರ ಪದಾರ್ಥ? (Garlic)", options: ["ಬೆಳ್ಳುಳ್ಳಿ", "ಈರುಳ್ಳಿ", "ಎಳ್ಳು"], answer: 0},
  {q: "ಚಿತ್ರದಲ್ಲಿರುವ ಕೆಂಪು ಬಣ್ಣದ ತರಕಾರಿ ಯಾವುದು? (Onion)", options: ["ಈರುಳ್ಳಿ", "ಬೆಳ್ಳುಳ್ಳಿ", "ಬಳ್ಳಿ"], answer: 0}
];

let current = 0, score = 0, currentShuffledOptions = [], correctTextForCurrentQuestion = "";
let clickSound = new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");
let correctSound = new Audio("https://actions.google.com/sounds/v1/cartoon/boing.ogg");
let wrongSound = new Audio("https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg");

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function loadQuestion() {
  if (current >= questions.length) {
    document.getElementById("quiz").innerHTML = "";
    document.getElementById("result").innerHTML = "🎉 Finished! Final Score: " + score + " / " + questions.length;
    return;
  }
  let q = questions[current];
  correctTextForCurrentQuestion = q.options[q.answer];
  currentShuffledOptions = shuffle([...q.options]);

  let html = `<div class="clue-text">ಚಿತ್ರದ ಸುಳಿವು (Clue):</div><div class="target-word">${q.q}</div>`;
  currentShuffledOptions.forEach((opt, index) => { html += `<button onclick="check(${index})">${opt}</button>`; });
  document.getElementById("quiz").innerHTML = html;
}

function check(selectedIndex) {
  clickSound.play().catch(e => {});
  let selectedText = currentShuffledOptions[selectedIndex];
  let buttons = document.querySelectorAll("#quiz button");

  buttons.forEach((btn, idx) => {
    btn.disabled = true;
    if (currentShuffledOptions[idx] === correctTextForCurrentQuestion) btn.style.background = "#a8e6a3";
    if (idx === selectedIndex && selectedText !== correctTextForCurrentQuestion) btn.style.background = "#ffb3b3";
  });

  if (selectedText === correctTextForCurrentQuestion) { score++; correctSound.play().catch(e => {}); }
  else { wrongSound.play().catch(e => {}); }

  document.getElementById("score").innerText = "Score: " + score + " / " + questions.length;
  setTimeout(() => { current++; loadQuestion(); }, 1500);
}
loadQuestion();
</script>
</body>
</html>
