<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verbs Mastery Challenge - English Grammar</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #cfe8f7; text-align: center; padding: 20px; }
    .box { background: white; padding: 20px; border-radius: 15px; max-width: 600px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .clue-text { font-size: 18px; color: #555; margin-bottom: 5px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    .target-word { font-size: 20px; font-weight: bold; color: #2c3e50; background: #e8f4f8; padding: 15px; border-radius: 8px; margin-bottom: 20px; line-height: 1.5; }
    button { display: block; width: 100%; margin: 8px 0; padding: 12px; border-radius: 10px; border: none; background: #fff4b3; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #ffeaa7; }
    #score { font-size: 20px; font-weight: bold; margin-bottom: 15px; }
    #result { font-size: 24px; font-weight: bold; color: #27ae60; margin-top: 20px; }
  </style>
</head>
<body>

<h2>📝 English Grammar Quiz (Verbs Chapter)</h2>
<div id="score">Score: 0</div>
<div class="box" id="quiz"></div>
<div id="result"></div>

<script>
let questions = [
  // --- SECTION 1: TYPES OF VERBS (ACTION, LINKING, HELPING) ---
  {q: "Identify the type of verb in: 'Mr. Tocklin WAS sad when the clock stopped.'", options: ["Linking Verb", "Action Verb", "Helping Verb"], answer: 0},
  {q: "Identify the type of verb in: 'The mechanical bird FLAPPED its metal wings.'", options: ["Action Verb", "Linking Verb", "Helping Verb"], answer: 0},
  {q: "Identify the underlined verb type in: 'They WERE searching for the missing gear.'", options: ["Helping Verb", "Action Verb", "Linking Verb"], answer: 0},
  {q: "Identify the type of verb in: 'Buddy SNIFFED around the dusty room.'", options: ["Action Verb", "Linking Verb", "Helping Verb"], answer: 0},
  {q: "Identify the type of verb in: 'The townspeople WERE happy at the end.'", options: ["Linking Verb", "Action Verb", "Helping Verb"], answer: 0},
  {q: "Identify the verb type: 'Aria CLIMBED the stairs.'", options: ["Action Verb", "Linking Verb", "Helping Verb"], answer: 0},
  {q: "Identify the verb type: 'Aria WAS calm.'", options: ["Linking Verb", "Action Verb", "Helping Verb"], answer: 0},
  {q: "Identify the underlined verb: 'The lamp WAS glowing.'", options: ["Helping Verb", "Linking Verb", "Action Verb"], answer: 0},

  // --- SECTION 2: TRANSITIVE VS INTRANSITIVE VERBS ---
  {q: "Is the verb transitive or intransitive? 'Aria FOUND a tiny wooden door.'", options: ["Transitive", "Intransitive"], answer: 0},
  {q: "Is the verb transitive or intransitive? 'The giant clock STOPPED suddenly.'", options: ["Intransitive", "Transitive"], answer: 0},
  {q: "Is the verb transitive or intransitive? 'The bird CHIRPED loudly.'", options: ["Intransitive", "Transitive"], answer: 0},
  {q: "Is the verb transitive or intransitive? 'She SOLVED the tricky riddle.'", options: ["Transitive", "Intransitive"], answer: 0},
  {q: "Is the verb transitive or intransitive? 'Buddy WAGGED his tail proudly.'", options: ["Transitive", "Intransitive"], answer: 0},
  {q: "Is the verb transitive or intransitive? 'Buddy BARKED.'", options: ["Intransitive", "Transitive"], answer: 0},
  {q: "Is the verb transitive or intransitive? 'Aria FOUND the gear.'", options: ["Transitive", "Intransitive"], answer: 0},
  {q: "Is the verb transitive or intransitive? 'The tower CHIMED.'", options: ["Intransitive", "Transitive"], answer: 0},
  {q: "Is the verb transitive or intransitive? 'Buddy SNIFFED the curtain.'", options: ["Transitive", "Intransitive"], answer: 0},

  // --- SECTION 3: SIMPLE & CONTINUOUS TENSES ---
  {q: "Fill in with Simple Past Tense: Aria and Buddy _____ at the Clockmaker's Tower. (arrive)", options: ["arrived", "arrives", "will arrive"], answer: 0},
  {q: "Fill in with Simple Present Tense: The bird _____ the Heart-Gear. (guard)", options: ["guards", "guarded", "will guard"], answer: 0},
  {q: "Fill in with Simple Future Tense: Tomorrow, Mr. Tocklin _____ the clock tower again. (check)", options: ["will check", "checked", "checks"], answer: 0},
  {q: "Fill in with Past Continuous Tense: The people _____ when the clock chimed. (cheer)", options: ["were cheering", "cheered", "will cheer"], answer: 0},
  {q: "Identify the tense of the verb: 'Aria WAS WALKING.'", options: ["Past Continuous Tense", "Simple Past Tense", "Simple Present Tense"], answer: 0},
  {q: "Identify the tense of the verb: 'She WILL CLIMB.'", options: ["Simple Future Tense", "Simple Present Tense", "Past Continuous Tense"], answer: 0}
];

let current = 0, score = 0, currentShuffledOptions = [], correctTextForCurrentQuestion = "";
let clickSound = new Audio("https://actions.google.com/sounds/v1/cartoon/pop.ogg");
let correctSound = new Audio("https://actions.google.com/sounds/v1/cartoon/boing.ogg");
let wrongSound = new Audio("https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg");

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function loadQuestion() {
  if (current >= questions.length) {
    document.getElementById("quiz").innerHTML = "";
    document.getElementById("result").innerHTML = "🎉 Quiz Completed! Final Score: " + score + " / " + questions.length;
    return;
  }
  let q = questions[current];
  correctTextForCurrentQuestion = q.options[q.answer];
  currentShuffledOptions = shuffle([...q.options]);

  let html = `<div class="clue-text">Question ${current + 1} of ${questions.length}:</div><div class="target-word">${q.q}</div>`;
  currentShuffledOptions.forEach((opt, index) => { html += `<button onclick="check(${index})">${opt}</button>`; });
  document.getElementById("quiz").innerHTML = html;
}

function check(selectedIndex) {
  clickSound.play().catch(e => {});
  let selectedText = currentShuffledOptions[selectedIndex];
  let buttons = document.querySelectorAll("#quiz button");

  buttons.forEach((btn, idx) => {
    btn.disabled = true;
    if (currentShuffledOptions[idx] === correctTextForCurrentQuestion) btn.style.background = "#a8e6a3";
    if (idx === selectedIndex && selectedText !== correctTextForCurrentQuestion) btn.style.background = "#ffb3b3";
  });

  if (selectedText === correctTextForCurrentQuestion) { score++; correctSound.play().catch(e => {}); }
  else { wrongSound.play().catch(e => {}); }

  document.getElementById("score").innerText = "Score: " + score + " / " + questions.length;
  setTimeout(() => { current++; loadQuestion(); }, 1500);
}
loadQuestion();
</script>
</body>
</html>
