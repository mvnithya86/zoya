<!DOCTYPE html>
<html>
<head>
<title>Quiz</title>
<style>
body { text-align:center; font-family:Arial; }
button { padding:10px; margin:5px; font-size:16px; }
.correct { background-color:lightgreen; }
.wrong { background-color:salmon; }
</style>
</head>

<body>

<h2>Rise of Christianity Quiz</h2>

<h3 id="question"></h3>

<div id="options"></div>

<h3 id="result"></h3>

<button onclick="nextQ()">Next</button>

<audio id="right" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>
<audio id="wrong" src="https://www.soundjay.com/buttons/sounds/button-10.mp3"></audio>

<script>

let q = 0;
let score = 0;

let quiz = [
["Who became the undisputed emperor of Rome?","Constantine","Nero","Augustus","Julius Caesar",0],
["Constantine shifted capital to?","Athens","Constantinople","Rome","Sparta",1],
["Old name of Constantinople?","Rome","Byzantium","Athens","Jerusalem",1],
["Christianity became official religion in?","2nd century","3rd century","4th century","5th century",2],
["Spiritual head of Christians?","King","Pope","Priest","Leader",1],

["Jesus rejected which principle?","Equality","Eye for eye","Peace","Love",1],
["Jesus taught love for?","Friends only","Enemies only","All people","Rich only",2],
["Jesus was crucified by?","Greeks","Romans","Egyptians","Persians",1],
["Governor in Jesus trial?","Herod","Pilate","Nero","Augustus",1],
["Jesus is called?","King","Messiah","Warrior","Prophet",1],

["Teachings recorded in?","Vedas","Bible","Gospels","Quran",2],
["Spread in Palestine by?","Paul","Peter","Mark","Luke",1],
["Later spread by?","John","Peter","Paul","Luke",2],
["Early Christians were?","Rulers","Minority","Rich","Powerful",1],
["They were persecuted by?","Greeks","Romans","Persians","Egyptians",1],

["Christianity legalized in?","200 CE","313 CE","400 CE","500 CE",1],
["Constantine defeated?","Nero","Maxentius","Herod","Augustus",1],
["Jesus born in?","Nazareth","Rome","Bethlehem","Jerusalem",2],
["Jesus grew up in?","Bethlehem","Nazareth","Rome","Athens",1],
["Jesus studied?","Greek","Roman","Jewish scriptures","Persian",2],

["John the Baptist was?","Brother","Cousin","Friend","Teacher",1],
["Jesus baptized in?","Sea","River","Lake","Temple",1],
["Holy Spirit appeared as?","Fire","Wind","Dove","Light",2],
["Voice called Jesus?","King","Son","Prophet","Leader",1],
["Number of disciples?","10","12","14","7",1],

["Main teaching?","War","Love","Power","Wealth",1],
["Jesus taught forgiveness to?","Friends","Enemies","Rich","None",1],
["Community formed after?","Birth","Death","Resurrection belief","War",2],
["Resurrection means?","Death","Rise again","Punishment","Sleep",1],
["Jesus lived in hearts of?","Romans","Followers","Kings","Soldiers",1],

["Christianity spread in?","Asia","Africa","Roman Empire","Europe only",2],
["Became world religion due to?","War","Teachings","Trade","Kings",1],
["Medieval means?","Future","Middle","Ancient","Modern",1],
["Medieval India period?","8th-18th","1st-5th","10th-20th","2nd-6th",0],
["Early medieval?","1st-5th","8th-13th","13th-18th","5th-8th",1],

["Later medieval?","8th-13th","13th-18th","5th-10th","1st-5th",1],
["Delhi Sultanate?","1200-1526","1500-1800","800-1200","500-1000",0],
["Mughal phase?","1200-1526","1526-18th","800-1200","1000-1500",1],
["Europe medieval?","600-1500","200-1000","100-500","800-2000",0],
["Messiah means?","King","Saviour","Teacher","Warrior",1],

["Herod was?","King","Governor","Puppet ruler","Priest",2],
["Jews awaited?","War","Messiah","King","Peace",1],
["Jesus challenged?","Greek ideas","Jewish traditions","Roman law","Persian culture",1],
["Teachings were?","Complex","Simple","Strict","Violent",1],
["Equality of?","Men","Women","Both","None",2],

["Christian HQ?","Rome","Vatican City","Paris","Athens",1],
["St Peter’s Basilica in?","Rome","London","Vatican","Paris",2],
["Jesus died by?","Hanging","Burning","Crucifixion","Drowning",2],
["Main idea?","War","Love & Forgiveness","Power","Wealth",1]
];

function loadQ(){
  document.getElementById("question").innerHTML = quiz[q][0];
  
  let optHTML="";
  for(let i=1;i<=4;i++){
    optHTML += `<button onclick="check(${i-1},this)">${quiz[q][i]}</button><br>`;
  }
  document.getElementById("options").innerHTML = optHTML;
}

function check(ans,btn){
  let correct = quiz[q][5];
  
  if(ans === correct){
    btn.classList.add("correct");
    document.getElementById("right").play();
    score++;
  } else {
    btn.classList.add("wrong");
    document.getElementById("wrong").play();
  }
}

function nextQ(){
  q++;
  if(q < quiz.length){
    loadQ();
  } else {
    document.getElementById("question").innerHTML = "Finished!";
    document.getElementById("options").innerHTML = "";
    document.getElementById("result").innerHTML = "Score: "+score+" / 50";
  }
}

loadQ();

</script>

</body>
</html>
