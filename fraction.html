
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 3 - Fractions Quiz</title>

<style>
body {
  font-family: Arial, sans-serif;
  background-color: #cfe8f7;
  text-align: center;
  padding: 20px;
  margin: 0;
}

h2 {
  color: #304b68;
}

.box {
  background: white;
  padding: 22px;
  border-radius: 15px;
  max-width: 550px;
  margin: auto;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.clue-text {
  font-size: 17px;
  color: #555;
  margin-bottom: 12px;
  font-weight: bold;
}

.target-word {
  font-size: 21px;
  font-weight: bold;
  color: #2c3e50;
  background: #e8f4f8;
  padding: 18px;
  border-radius: 10px;
  margin-bottom: 20px;
  line-height: 1.6;
}

button {
  display: block;
  width: 100%;
  margin: 10px 0;
  padding: 14px;
  border-radius: 10px;
  border: none;
  background: #fff4b3;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

button:hover:not(:disabled) {
  background: #ffe18a;
}

button:disabled {
  cursor: default;
  opacity: 1;
}

#score {
  font-size: 21px;
  font-weight: bold;
  margin: 15px;
  color: #34495e;
}

#result {
  font-size: 23px;
  font-weight: bold;
  color: #27ae60;
  margin-top: 20px;
}

#progress {
  background: #ffffff;
  border-radius: 20px;
  max-width: 550px;
  margin: 15px auto;
  height: 12px;
  overflow: hidden;
}

#progressBar {
  background: #8ed6a5;
  height: 100%;
  width: 0%;
  transition: width 0.3s;
}

.feedback {
  font-size: 18px;
  font-weight: bold;
  margin-top: 12px;
}

.restart {
  background: #b8e0d2;
  margin-top: 20px;
}
</style>
</head>

<body>

<h2>🍰 Grade 3 Mathematics</h2>
<h3>Fractions Mastery Challenge</h3>

<div id="score">Score: 0 / 30</div>

<div id="progress">
  <div id="progressBar"></div>
</div>

<div class="box" id="quiz"></div>

<div id="result"></div>

<script>

// 30 FRACTION QUESTIONS

const questions = [

 // ADDITION - SAME DENOMINATOR (1-8)

 {
 q: "1/8 + 3/8 = ?",
 options: ["4/8", "3/8", "5/8"],
 answer: "4/8"
 },
 {
 q: "2/7 + 3/7 = ?",
 options: ["5/7", "4/7", "6/7"],
 answer: "5/7"
 },
 {
 q: "3/9 + 2/9 = ?",
 options: ["5/9", "4/9", "6/9"],
 answer: "5/9"
 },
 {
 q: "1/6 + 4/6 = ?",
 options: ["5/6", "4/6", "3/6"],
 answer: "5/6"
 },
 {
 q: "2/10 + 5/10 = ?",
 options: ["7/10", "6/10", "8/10"],
 answer: "7/10"
 },
 {
 q: "3/8 + 4/8 = ?",
 options: ["7/8", "6/8", "5/8"],
 answer: "7/8"
 },
 {
 q: "2/5 + 1/5 = ?",
 options: ["3/5", "2/5", "4/5"],
 answer: "3/5"
 },
 {
 q: "4/12 + 3/12 = ?",
 options: ["7/12", "6/12", "8/12"],
 answer: "7/12"
 },

 // SUBTRACTION - SAME DENOMINATOR (9-15)

 {
 q: "5/8 - 2/8 = ?",
 options: ["3/8", "2/8", "4/8"],
 answer: "3/8"
 },
 {
 q: "6/7 - 4/7 = ?",
 options: ["2/7", "3/7", "4/7"],
 answer: "2/7"
 },
 {
 q: "7/9 - 3/9 = ?",
 options: ["4/9", "3/9", "5/9"],
 answer: "4/9"
 },
 {
 q: "5/6 - 1/6 = ?",
 options: ["4/6", "3/6", "5/6"],
 answer: "4/6"
 },
 {
 q: "9/10 - 5/10 = ?",
 options: ["4/10", "5/10", "3/10"],
 answer: "4/10"
 },
 {
 q: "7/8 - 2/8 = ?",
 options: ["5/8", "4/8", "6/8"],
 answer: "5/8"
 },
 {
 q: "4/5 - 1/5 = ?",
 options: ["3/5", "2/5", "4/5"],
 answer: "3/5"
 },

 // ASCENDING ORDER (16-19)

 {
 q: "Arrange in ASCENDING order: 3/6, 1/6, 5/6",
 options: [
 "1/6, 3/6, 5/6",
 "5/6, 3/6, 1/6",
 "3/6, 1/6, 5/6"
 ],
 answer: "1/6, 3/6, 5/6"
 },
 {
 q: "Arrange in ASCENDING order: 4/8, 2/8, 6/8",
 options: [
 "2/8, 4/8, 6/8",
 "6/8, 4/8, 2/8",
 "4/8, 2/8, 6/8"
 ],
 answer: "2/8, 4/8, 6/8"
 },
 {
 q: "Arrange in ASCENDING order: 5/10, 1/10, 3/10",
 options: [
 "1/10, 3/10, 5/10",
 "5/10, 3/10, 1/10",
 "3/10, 1/10, 5/10"
 ],
 answer: "1/10, 3/10, 5/10"
 },
 {
 q: "Arrange in ASCENDING order: 3/7, 6/7, 2/7",
 options: [
 "2/7, 3/7, 6/7",
 "6/7, 3/7, 2/7",
 "3/7, 2/7, 6/7"
 ],
 answer: "2/7, 3/7, 6/7"
 },

 // DESCENDING ORDER (20-22)

 {
 q: "Arrange in DESCENDING order: 2/5, 4/5, 1/5",
 options: [
 "4/5, 2/5, 1/5",
 "1/5, 2/5, 4/5",
 "2/5, 1/5, 4/5"
 ],
 answer: "4/5, 2/5, 1/5"
 },
 {
 q: "Arrange in DESCENDING order: 3/8, 7/8, 5/8",
 options: [
 "7/8, 5/8, 3/8",
 "3/8, 5/8, 7/8",
 "5/8, 3/8, 7/8"
 ],
 answer: "7/8, 5/8, 3/8"
 },
 {
 q: "Arrange in DESCENDING order: 1/6, 4/6, 2/6",
 options: [
 "4/6, 2/6, 1/6",
 "1/6, 2/6, 4/6",
 "2/6, 4/6, 1/6"
 ],
 answer: "4/6, 2/6, 1/6"
 },

 // EQUIVALENT FRACTIONS (23-30)

 {
 q: "Which fraction is equivalent to 1/2?",
 options: ["2/4", "1/4", "2/3"],
 answer: "2/4"
 },
 {
 q: "Which fraction is equivalent to 1/3?",
 options: ["2/6", "3/6", "2/5"],
 answer: "2/6"
 },
 {
 q: "Which fraction is equivalent to 2/3?",
 options: ["4/6", "3/6", "2/6"],
 answer: "4/6"
 },
 {
 q: "Which fraction is equivalent to 1/4?",
 options: ["2/8", "3/8", "4/8"],
 answer: "2/8"
 },
 {
 q: "Which fraction is equivalent to 3/4?",
 options: ["6/8", "4/8", "5/8"],
 answer: "6/8"
 },
 {
 q: "Which fraction is equivalent to 2/5?",
 options: ["4/10", "3/10", "5/10"],
 answer: "4/10"
 },
 {
 q: "Which fraction is equivalent to 3/6?",
 options: ["1/2", "1/3", "2/3"],
 answer: "1/2"
 },
 {
 q: "Which fraction is equivalent to 2/4?",
 options: ["1/2", "1/4", "3/4"],
 answer: "1/2"
 }

];


// QUIZ VARIABLES

let current = 0;
let score = 0;
let currentOptions = [];
let answered = false;


// SOUND EFFECTS - NO EXTERNAL FILES REQUIRED

let audioContext;

function playSound(type) {
  try {
    audioContext = audioContext || new
      (window.AudioContext || window.webkitAudioContext)();

    if (audioContext.state === "suspended") {
      audioContext.resume();
    }

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    if (type === "correct") {
      oscillator.frequency.value = 850;
      oscillator.type = "sine";
    }
    else if (type === "wrong") {
      oscillator.frequency.value = 180;
      oscillator.type = "triangle";
    }
    else {
      oscillator.frequency.value = 500;
      oscillator.type = "sine";
    }

    gain.gain.setValueAtTime(0.15, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(
      0.001, audioContext.currentTime + 0.25
    );

    oscillator.start();
    oscillator.stop(audioContext.currentTime + 0.25);

  } catch(e) {}
}


// SHUFFLE OPTIONS

function shuffle(array) {
  let arr = [...array];

  for (let i = arr.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }

  return arr;
}


// LOAD QUESTION

function loadQuestion() {

  answered = false;

  if (current >= questions.length) {
    showFinalResult();
    return;
  }

  let q = questions[current];

  currentOptions = shuffle(q.options);

  let html = `
    <div class="clue-text">
      Question ${current + 1} of ${questions.length}
    </div>

    <div class="target-word">
      ${q.q}
    </div>
  `;

  currentOptions.forEach((option, index) => {
    html += `
      <button onclick="checkAnswer(${index})">
        ${option}
      </button>
    `;
  });

  html += `<div class="feedback" id="feedback"></div>`;

  document.getElementById("quiz").innerHTML = html;

  document.getElementById("progressBar").style.width =
    (current / questions.length * 100) + "%";
}


// CHECK ANSWER

function checkAnswer(selectedIndex) {

  if (answered) return;

  answered = true;

  playSound("click");

  const correctAnswer = questions[current].answer;
  const selectedAnswer = currentOptions[selectedIndex];

  const buttons = document.querySelectorAll("#quiz button");

  buttons.forEach((btn, index) => {

    btn.disabled = true;

    if (currentOptions[index] === correctAnswer) {
      btn.style.background = "#a8e6a3";
    }

    if (index === selectedIndex &&
        selectedAnswer !== correctAnswer) {
      btn.style.background = "#ffb3b3";
    }

  });

  const feedback = document.getElementById("feedback");

  if (selectedAnswer === correctAnswer) {

    score++;

    feedback.innerHTML = "🎉 Correct! Well done!";
    feedback.style.color = "#218838";

    playSound("correct");

  } else {

    feedback.innerHTML = "❌ Incorrect! Try the next one!";
    feedback.style.color = "#d63031";

    playSound("wrong");

  }

  document.getElementById("score").innerText =
    "Score: " + score + " / " + questions.length;

  document.getElementById("progressBar").style.width =
    ((current + 1) / questions.length * 100) + "%";

  setTimeout(() => {
    current++;
    loadQuestion();
  }, 1500);

}


// FINAL RESULT PAGE

function showFinalResult() {

  document.getElementById("quiz").innerHTML = "";

  document.getElementById("progressBar").style.width = "100%";

  let percentage = Math.round(
    (score / questions.length) * 100
  );

  let message = "";

  if (percentage >= 90) {
    message = "🏆 Excellent! You are a Fraction Champion!";
  }
  else if (percentage >= 70) {
    message = "🌟 Very Good! Keep practising!";
  }
  else if (percentage >= 50) {
    message = "👏 Good effort! You are improving!";
  }
  else {
    message = "💪 Keep practising. You can do it!";
  }

  document.getElementById("result").innerHTML = `
    <div class="box">
      <h2>🎉 Quiz Completed!</h2>

      <h1>${score} / ${questions.length}</h1>

      <h3>${percentage}%</h3>

      <p>${message}</p>

      <button class="restart" onclick="restartQuiz()">
        🔄 Play Again
      </button>
    </div>
  `;

}


// RESTART QUIZ

function restartQuiz() {

  current = 0;
  score = 0;

  document.getElementById("score").innerText =
    "Score: 0 / " + questions.length;

  document.getElementById("result").innerHTML = "";

  loadQuestion();

}

loadQuestion();

</script>

</body>
</html>
