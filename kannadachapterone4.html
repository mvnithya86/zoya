  {q: "Look at the picture. What is the correct Kannada name for 'Dog'? <span class='translation'>(ಚಿತ್ರವನ್ನು ನೋಡಿ 'Dog' ಗೆ ಸರಿಯಾದ ಕನ್ನಡ ಪದ ಯಾವುದು?)</span> <br><div class='big-picture-box'>🐶</div>", options: ["ನಾಯಿ", "ಬೆಕ್ಕು", "ನರಿ"], answer: 0},
  {q: "Look at the picture. What is the correct Kannada name for 'Cat'? <span class='translation'>(ಚಿತ್ರವನ್ನು ನೋಡಿ 'Cat' ಗೆ ಸರಿಯಾದ ಕನ್ನಡ ಪದ ಯಾವುದು?)</span> <br><div class='big-picture-box'>🐱</div>", options: ["ಬೆಕ್ಕು", "ಇಲಿ", "ಕೋತಿ"], answer: 0},

  {q: "Look at the picture. What is the correct Kannada name for 'Car'? <span class='translation'>(ಚಿತ್ರವನ್ನು ನೋಡಿ 'Car' ಗೆ ಸರಿಯಾದ ಕನ್ನಡ ಪದ ಯಾವುದು?)</span> <br><div class='big-picture-box'>🚗</div>", options: ["ಕಾರು", "ಬಸ್ಸು", "ಸೈಕಲ್"], answer: 0},
  {q: "Look at the picture. What is the correct Kannada name for 'Umbrella'? <span class='translation'>(ಚಿತ್ರವನ್ನು ನೋಡಿ 'Umbrella' ಗೆ ಸರಿಯಾದ ಕನ್ನಡ ಪದ ಯಾವುದು?)</span> <br><div class='big-picture-box'>☂️</div>", options: ["ಛತ್ರಿ", "ಬಟ್ಟೆ", "ಟೋಪಿ"], answer: 0},
  {q: "Look at the picture. What is the correct Kannada name for 'Star'? <span class='translation'>(ಚಿತ್ರವನ್ನು ನೋಡಿ 'Star' ಗೆ ಸರಿಯಾದ ಕನ್ನಡ ಪದ ಯಾವುದು?)</span> <br><div class='big-picture-box'>⭐</div>", options: ["ನಕ್ಷತ್ರ", "ಮಿಂಚು", "ಬೆಳಕು"], answer: 0},

  {q: "Look at the picture. What is the correct Kannada name for 'Milk'? <span class='translation'>(ಚಿತ್ರವನ್ನು ನೋಡಿ 'Milk' ಗೆ ಸರಿಯಾದ ಕನ್ನಡ ಪದ ಯಾವುದು?)</span> <br><div class='big-picture-box'>🥛</div>", options: ["ಹಾಲು", "ಮೊಸರು", "ಮಜ್ಜಿಗೆ"], answer: 0},
  {q: "Look at the picture. What is the correct Kannada name for 'Boy'? <span class='translation'>(ಚಿತ್ರವನ್ನು ನೋಡಿ 'Boy' ಗೆ ಸರಿಯಾದ ಕನ್ನಡ ಪದ ಯಾವುದು?)</span> <br><div class='big-picture-box'>👦</div>", options: ["ಹುಡುಗ", "ಹುಡುಗಿ", "ಮಗು"], answer: 0}
];

let current = 0;
let score = 0;
let currentShuffledOptions = [];
let correctTextForCurrentQuestion = "";

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function loadQuestion() {
  if (current >= questions.length) {
    document.getElementById("quiz").innerHTML = "";
    document.getElementById("result").innerHTML = "🎉 Finished! Final Score: " + score + " / " + questions.length;
    return;
  }
  let q = questions[current];
  correctTextForCurrentQuestion = q.options[q.answer];
  currentShuffledOptions = shuffle([...q.options]);

  let html = `<p><b>Question ${current + 1}: ${q.q}</b></p>`;
  currentShuffledOptions.forEach((opt, index) => {
    html += `<button onclick="check(${index})">${opt}</button>`;
  });
  document.getElementById("quiz").innerHTML = html;
}

function check(selectedIndex) {
  let selectedText = currentShuffledOptions[selectedIndex];
  let buttons = document.querySelectorAll("#quiz button");

  buttons.forEach((btn, idx) => {
    btn.disabled = true;
    let btnText = currentShuffledOptions[idx];
    if (btnText === correctTextForCurrentQuestion) {
      btn.style.background = "#a8e6a3";
    }
    if (idx === selectedIndex && selectedText !== correctTextForCurrentQuestion) {
      btn.style.background = "#ffb3b3";
    }
  });

  if (selectedText === correctTextForCurrentQuestion) {
    score++;
  }

  document.getElementById("score").innerText = "Score: " + score;
  setTimeout(() => {
    current++;
    loadQuestion();
  }, 1500);
}

loadQuestion();
</script>
