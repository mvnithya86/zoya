<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 3 Mathematics: Mixed Word Problems Quiz</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --correct: #16a34a;
            --correct-bg: #dcfce7;
            --incorrect: #dc2626;
            --incorrect-bg: #fee2e2;
            --border: #e2e8f0;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        header {
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .question-card {
            margin-bottom: 25px;
        }

        .question-tag {
            display: inline-block;
            padding: 4px 10px;
            background: #e0e7ff;
            color: var(--primary);
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .question-text {
            font-size: 1.15rem;
            line-height: 1.6;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .answer-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }

        @media (min-width: 600px) {
            .answer-container {
                flex-direction: row;
                align-items: center;
            }
        }

        .answer-input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .answer-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .answer-input.correct {
            background-color: var(--correct-bg);
            border-color: var(--correct);
            color: var(--correct);
            font-weight: 700;
        }

        .answer-input.incorrect {
            background-color: var(--incorrect-bg);
            border-color: var(--incorrect);
            color: var(--incorrect);
            font-weight: 700;
        }

        .feedback-badge {
            margin-top: 10px;
            font-weight: 700;
            font-size: 1rem;
            display: none;
        }

        .feedback-badge.correct {
            color: var(--correct);
            display: block;
        }

        .feedback-badge.incorrect {
            color: var(--incorrect);
            display: block;
        }

        .explanation {
            margin-top: 20px;
            padding: 15px;
            border-radius: var(--radius);
            background: #f1f5f9;
            border-left: 4px solid var(--primary);
            font-size: 0.95rem;
            line-height: 1.5;
            display: none;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: var(--radius);
            background-color: var(--primary);
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn:hover:not([disabled]) {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }

        .btn-verify {
            background-color: #059669;
        }

        .btn-verify:hover:not([disabled]) {
            background-color: #047857;
        }

        .score-modal {
            text-align: center;
            padding: 20px 0;
            display: none;
        }

        .score-modal h2 {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .score-modal p {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        .score-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: #e0e7ff;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0 auto 25px auto;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <header>
        <h1>Grade 3 Mathematics Quiz</h1>
        <p class="subtitle">Mixed Word Problems Practice (68 Questions)</p>
    </header>

    <div id="quizContent">
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="stats-bar">
            <span id="questionCount">Question 1 of 68</span>
            <span id="scoreTracker">Score: 0</span>
        </div>

        <div class="question-card">
            <span class="question-tag" id="questionTag">Word Problem</span>
            <div class="question-text" id="questionText">Loading...</div>

            <div class="answer-container">
                <input type="text" id="userAnswerInput" class="answer-input" placeholder="Type your answer here..." autocomplete="off">
                <button class="btn btn-verify" id="verifyBtn" onclick="verifyAnswer()">Verify Answer</button>
            </div>

            <div class="feedback-badge" id="feedbackBadge"></div>
            <div class="explanation" id="explanation"></div>
        </div>

        <div class="controls">
            <button class="btn" id="prevBtn" onclick="prevQuestion()" disabled>Previous</button>
            <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>Next Question</button>
        </div>
    </div>

    <div class="score-modal" id="scoreModal">
        <h2>Quiz Completed!</h2>
        <div class="score-circle" id="finalScore">0%</div>
        <p id="scoreDetails">You answered 0 out of 68 questions correctly.</p>
        <button class="btn" onclick="restartQuiz()">Try Again</button>
    </div>
</div>

    let currentIndex = 0;
    let score = 0;
    let userAnswers = new Array(allQuestions.length).fill(null);
    let isVerified = new Array(allQuestions.length).fill(false);

    const answerInput = document.getElementById('userAnswerInput');
    const verifyBtn = document.getElementById('verifyBtn');
    const feedbackBadge = document.getElementById('feedbackBadge');
    const explanationDiv = document.getElementById('explanation');

    // Allow pressing Enter key to submit answer
    answerInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && !verifyBtn.disabled) {
            verifyAnswer();
        }
    });

    function normalizeText(text) {
        if (!text) return '';
        // Remove currency symbols, commas, units, and extra spaces for flexible comparison
        return text.toString()
            .toLowerCase()
            .replace(/[,₹]/g, '')
            .replace(/\s+/g, ' ')
            .trim();
    }

    function loadQuestion() {
        const q = allQuestions[currentIndex];
        document.getElementById('questionTag').innerText = `Question ${currentIndex + 1}`;
        document.getElementById('questionText').innerText = q.question;
        
        document.getElementById('questionCount').innerText = `Question ${currentIndex + 1} of ${allQuestions.length}`;
        document.getElementById('scoreTracker').innerText = `Score: ${score}`;
        
        const progressPercent = ((currentIndex + 1) / allQuestions.length) * 100;
        document.getElementById('progressBar').style.width = `${progressPercent}%`;

        // Reset inputs and UI state
        answerInput.classList.remove('correct', 'incorrect');
        feedbackBadge.className = 'feedback-badge';
        feedbackBadge.style.display = 'none';
        explanationDiv.style.display = 'none';

        if (isVerified[currentIndex]) {
            answerInput.value = userAnswers[currentIndex];
            answerInput.disabled = true;
            verifyBtn.disabled = true;
            
            const userNorm = normalizeText(userAnswers[currentIndex]);
            const targetNorm = normalizeText(q.targetAnswer);
            
            if (userNorm === targetNorm || extractNumbers(userNorm) === extractNumbers(targetNorm)) {
                answerInput.classList.add('correct');
                feedbackBadge.innerText = '✓ Correct Answer!';
                feedbackBadge.classList.add('correct');
            } else {
                answerInput.classList.add('incorrect');
                feedbackBadge.innerText = `✕ Incorrect! Correct Answer: ${q.targetAnswer}`;
                feedbackBadge.classList.add('incorrect');
            }

            explanationDiv.style.display = 'block';
            explanationDiv.innerText = q.explanation;
            document.getElementById('nextBtn').disabled = false;
        } else {
            answerInput.value = userAnswers[currentIndex] || '';
            answerInput.disabled = false;
            verifyBtn.disabled = false;
            document.getElementById('nextBtn').disabled = true;
            answerInput.focus();
        }

        document.getElementById('prevBtn').disabled = currentIndex === 0;

        if (currentIndex === allQuestions.length - 1 && isVerified[currentIndex]) {
            document.getElementById('nextBtn').innerText = 'Finish Quiz';
        } else {
            document.getElementById('nextBtn').innerText = 'Next Question';
        }
    }

    function extractNumbers(str) {
        const match = str.match(/\d+/g);
        return match ? match.join('') : str;
    }

    function verifyAnswer() {
        const userVal = answerInput.value.trim();
        if (!userVal) {
            alert('Please enter an answer before verifying.');
            return;
        }

        userAnswers[currentIndex] = userVal;
        isVerified[currentIndex] = true;

        const q = allQuestions[currentIndex];
        const userNorm = normalizeText(userVal);
        const targetNorm = normalizeText(q.targetAnswer);

        const isCorrect = (userNorm === targetNorm) || (extractNumbers(userNorm) === extractNumbers(targetNorm) && extractNumbers(targetNorm) !== '');

        if (isCorrect) {
            score++;
        }

        loadQuestion();
    }

    function nextQuestion() {
        if (currentIndex < allQuestions.length - 1) {
            currentIndex++;
            loadQuestion();
        } else {
            showScoreModal();
        }
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            loadQuestion();
        }
    }

    function showScoreModal() {
        document.getElementById('quizContent').style.display = 'none';
        const scoreModal = document.getElementById('scoreModal');
        scoreModal.style.display = 'block';

        const percentage = Math.round((score / allQuestions.length) * 100);
        document.getElementById('finalScore').innerText = `${percentage}%`;
        document.getElementById('scoreDetails').innerText = `You answered ${score} out of ${allQuestions.length} questions correctly.`;
    }

    function restartQuiz() {
        currentIndex = 0;
        score = 0;
        userAnswers = new Array(allQuestions.length).fill(null);
        isVerified = new Array(allQuestions.length).fill(false);
        document.getElementById('quizContent').style.display = 'block';
        document.getElementById('scoreModal').style.display = 'none';
        loadQuestion();
    }

    // Initialize Quiz
    loadQuestion();
</script>

</body>
</html>
